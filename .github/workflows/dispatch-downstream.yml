name: Dispatch design.updated

on:
  push:
    branches: [main]
    paths:
      - 'design-system/**'
      - 'css/**'
      - 'brand/**'
      - 'ecosystem.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    name: Notify consumer surfaces
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Dispatch design.updated events
        env:
          GH_TOKEN: ${{ secrets.PAGLAAI_GITHUB_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "PAGLAAI_GITHUB_TOKEN is not configured; downstream dispatches were not attempted."
            echo "::warning::Configure PAGLAAI_GITHUB_TOKEN to synchronize consumer repositories."
            exit 0
          fi

          PAYLOAD=$(printf '{"event_type":"design.updated","client_payload":{"source":"PaglaDESIGN","sha":"%s"}}' "$GITHUB_SHA")
          dispatch_failed=0
          for repo in paglaai/paglaai.space paglaai/paglaai-docs; do
            response_file=$(mktemp)
            set +e
            http_code=$(curl --fail-with-body --show-error --silent \
              --output "$response_file" --write-out "%{http_code}" \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$repo/dispatches" \
              -d "$PAYLOAD")
            curl_status=$?
            set -e
            response=$(cat "$response_file")
            rm -f "$response_file"

            if [ "$curl_status" -ne 0 ] || ! [[ "$http_code" =~ ^2[0-9][0-9]$ ]]; then
              echo "Dispatch to $repo failed (HTTP ${http_code:-unknown}, curl $curl_status): $response" >&2
              dispatch_failed=1
            else
              echo "Dispatched design.updated to $repo (HTTP $http_code)."
            fi
          done
          exit "$dispatch_failed"
