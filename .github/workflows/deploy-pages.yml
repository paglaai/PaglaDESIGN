name: Deploy PaglaDESIGN (FERN Style) to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build FERN Documentation Site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # Required for checkout and repository-local build inputs.
      pages: write # Required by upload-pages-artifact for the Pages deployment artifact.
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Build Tokens
        uses: ./.github/actions/build-tokens
        with:
          tokens_path: "design-system/DESIGN_TOKENS.md"
          css_output_path: "css/tokens.css"

      - name: Install pinned CI tools
        run: python -m pip install -r .github/requirements-ci.txt
      - name: Run documentation tests
        run: python -m pytest tests/ -v
      - name: Verify generated token stylesheet is committed
        run: git diff --exit-code -- css/tokens.css
      - name: Generate FERN Static Site
        run: |
          python3 bin/build_fern.py --out-dir _site

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write # Required by actions/deploy-pages to publish the artifact.
      id-token: write # Required by GitHub Pages OIDC deployment authentication.
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  smoke-test:
    name: Smoke test deployed site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: deploy
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Check deployment
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: python3 bin/smoke_test.py "$PAGE_URL"
