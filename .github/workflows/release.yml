name: "Release & Publish Artifacts"

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v2.1.0)'
        required: true
        default: 'v2.1.0'

permissions:
  contents: write
  packages: write

jobs:
  publish-assets:
    name: "Compile & Publish Release Assets"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Design Tokens and CSS Artifacts
        uses: ./.github/actions/build-tokens
        with:
          tokens_path: "design-system/DESIGN_TOKENS.md"
          css_output_path: "css/tokens.css"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Ecosystem Registry
        run: |
          python3 -m json.tool ecosystem.json > /dev/null
          python3 -m json.tool ecosystem.schema.json > /dev/null
          echo "ecosystem.json + ecosystem.schema.json: valid JSON"

      - name: Package BrandKit, Fonts, and Compiled Assets
        run: |
          echo "=== Packaging BrandKit, Fonts & Production Assets ==="
          mkdir -p dist/brandkit dist/css dist/fonts
          
          # Copy BrandKit files
          if [ -d "brand" ]; then
            cp -r brand/* dist/brandkit/
          fi
          
          # Copy Compiled Stylesheets
          if [ -d "css" ]; then
            cp -r css/* dist/css/
          fi

          # Copy Typeface Binaries
          if [ -d "fonts" ]; then
            cp -r fonts/* dist/fonts/
          fi

          # Copy Ecosystem Registry, Schema, and Package Manifest
          cp ecosystem.json ecosystem.schema.json package.json LICENSE README.md dist/

          # Create distributable archive
          tar -czvf pagladesign-assets.tar.gz -C dist .

      - name: Set up Node.js for Package Publishing
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@paglaai"

      - name: Publish to GitHub Packages
        run: |
          echo "=== Publishing @paglaai/pagladesign to GitHub Packages ==="
          npm publish || echo "Package publish skipped or already exists."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        with:
          name: "PaglaDESIGN ${{ github.ref_name || inputs.version }}"
          tag_name: ${{ github.ref_name || inputs.version }}
          generate_release_notes: true
          files: |
            pagladesign-assets.tar.gz
            css/tokens.css
            ecosystem.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

