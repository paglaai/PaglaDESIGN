name: "Continuous Integration & Quality Gate"

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-design-system:
    name: "Validate Tokens & Styles"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Validate Design Tokens
        uses: ./.github/actions/build-tokens
        with:
          tokens_path: "design-system/DESIGN_TOKENS.md"
          css_output_path: "css/tokens.css"

  validate-mcp-server:
    name: "Validate MCP Server"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .ai/mcp
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 pytest black

      - name: Code Formatting Check (Black)
        run: black --check .

      - name: Lint with Flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run MCP Server Tests
        run: |
          # Run pytest if test files exist, otherwise perform a dry-run syntax check
          if [ -d "tests" ] || glob_tests=$(find . -name "test_*.py" | grep .); then
            pytest
          else
            echo "No pytest suite found, executing server.py import sanity check."
            python -m py_compile server.py rag.py
          fi
