name: "Continuous Integration & Quality Gate"

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-design-system:
    name: "Validate Tokens & Styles"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build and Validate Design Tokens
        uses: ./.github/actions/build-tokens
        with:
          tokens_path: "design-system/DESIGN_TOKENS.md"
          css_output_path: "css/tokens.css"

      - name: Verify generated token stylesheet is committed
        run: git diff --exit-code -- css/tokens.css

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Run Token Parity Test Suite
        run: |
          pip install pytest
          pytest tests/ -v

  validate-ecosystem:
    name: "Validate Ecosystem Registry"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate ecosystem.json against its JSON Schema
        run: |
          python3 -m json.tool ecosystem.json > /dev/null
          python3 -m pip install --quiet jsonschema
          python3 <<'PY'
          import json
          import pathlib
          import jsonschema

          eco = json.loads(pathlib.Path("ecosystem.json").read_text(encoding="utf-8"))
          schema = json.loads(pathlib.Path("ecosystem.schema.json").read_text(encoding="utf-8"))
          jsonschema.validate(instance=eco, schema=schema)
          for entry in eco["ecosystem"]:
              repo = entry.get("repo", "")
              if repo.startswith("paglaai/") and repo != repo.lower():
                  print(f"Warning: ecosystem entry uses uppercase repository name: {repo}")
          active = sum(1 for entry in eco["ecosystem"] if entry["status"] == "active")
          planned = sum(1 for entry in eco["ecosystem"] if entry["status"] == "planned")
          print(f"Registry: {len(eco['ecosystem'])} entries ({active} active, {planned} planned)")
          print(f"Authority: {eco['authority']['id']} v{eco['version']}")
          print("JSON Schema validation: PASS")
          PY

      - name: Validate frontmatter contract exists
        run: |
          test -f design-system/RENDERER_API.md || (echo "RENDERER_API.md missing" && exit 1)
          test -f governance/AUDIENCE_RENDERER_SPEC.md || (echo "AUDIENCE_RENDERER_SPEC.md missing" && exit 1)
          test -f ecosystem.json || (echo "ecosystem.json missing" && exit 1)
          test -f ecosystem.schema.json || (echo "ecosystem.schema.json missing" && exit 1)
          echo "Contract files: OK"

  validate-mcp-server:
    name: "Validate MCP Server"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .ai/mcp
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 pytest black

      - name: Code Formatting Check (Black)
        run: black --check .

      - name: Lint with Flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run MCP Server Tests
        run: python -m pytest -q
