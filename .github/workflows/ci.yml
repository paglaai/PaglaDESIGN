name: "Continuous Integration & Quality Gate"

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-design-system:
    name: "Validate Tokens & Styles"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Validate Design Tokens
        uses: ./.github/actions/build-tokens
        with:
          tokens_path: "design-system/DESIGN_TOKENS.md"
          css_output_path: "css/tokens.css"

  validate-ecosystem:
    name: "Validate Ecosystem Registry"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate ecosystem.json is valid JSON and matches schema
        run: |
          echo "=== Validating ecosystem.json ==="
          python3 -m json.tool ecosystem.json > /dev/null
          echo "JSON syntax: OK"
          python3 << 'PY'
          import json, pathlib, sys
          eco = json.loads(pathlib.Path("ecosystem.json").read_text())
          schema = json.loads(pathlib.Path("ecosystem.schema.json").read_text())
          # Lightweight schema checks without jsonschema dependency
          assert eco.get("version"), "version required"
          assert eco.get("authority", {}).get("id") == "pagladesign", "authority must be pagladesign"
          assert isinstance(eco.get("ecosystem"), list) and len(eco["ecosystem"]) >= 1
          ids = [e["id"] for e in eco["ecosystem"]]
          assert len(ids) == len(set(ids)), f"duplicate ids: {ids}"
          for e in eco["ecosystem"]:
              assert e.get("repo", "").startswith("paglaai/"), f"repo must be paglaai/*: {e}"
              assert e.get("status") in ("active", "planned", "deprecated"), f"bad status: {e}"
              assert e.get("role") in ("authority", "surface", "product", "runtime"), f"bad role: {e}"
          assert "pipelines" in eco and "githubToCloudflare" in eco["pipelines"]
          assert "roadmap" in eco and len(eco["roadmap"]["phases"]) == 3
          print(f"Registry: {len(eco['ecosystem'])} entries ({sum(1 for x in eco['ecosystem'] if x['status']=='active')} active, {sum(1 for x in eco['ecosystem'] if x['status']=='planned')} planned)")
          print(f"Authority: {eco['authority']['id']} v{eco['version']}")
          print("Schema checks: PASS")
          PY

      - name: Validate frontmatter contract exists
        run: |
          test -f design-system/RENDERER_API.md || (echo "RENDERER_API.md missing" && exit 1)
          test -f governance/AUDIENCE_RENDERER_SPEC.md || (echo "AUDIENCE_RENDERER_SPEC.md missing" && exit 1)
          test -f ecosystem.json || (echo "ecosystem.json missing" && exit 1)
          test -f ecosystem.schema.json || (echo "ecosystem.schema.json missing" && exit 1)
          echo "Contract files: OK"

  validate-mcp-server:
    name: "Validate MCP Server"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .ai/mcp
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 pytest black

      - name: Code Formatting Check (Black)
        run: black --check .

      - name: Lint with Flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run MCP Server Tests
        run: |
          # Run pytest if test files exist, otherwise perform a dry-run syntax check
          if [ -d "tests" ] || glob_tests=$(find . -name "test_*.py" | grep .); then
            pytest
          else
            echo "No pytest suite found, executing server.py import sanity check."
            python -m py_compile server.py rag.py
          fi
